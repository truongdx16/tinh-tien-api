server:
  addr: ":2170"
  read_timeout: 15s
  write_timeout: 15s

database:
  # Host port 2171 (21 + kênh 7) → MariaDB container 3306
  dsn: "tinh_tien:tinh_tien@tcp(localhost:2171)/tinh_tien?charset=utf8mb4&parseTime=True&loc=UTC"

auth:
  # Ghi đè bằng biến môi trường JWT_SECRET (như DB_DSN cho dsn); production
  # bắt buộc >= 32 ký tự ngẫu nhiên (openssl rand -hex 32).
  jwt_secret: "change-me-in-production"
  # Thời hạn đăng nhập: 30 ngày (720h) để người dùng không phải đăng nhập lại
  # liên tục. Có thể ghi đè bằng biến môi trường TOKEN_TTL (vd: 2160h).
  token_ttl: 720h

app:
  # Ngày thống kê & bộ lọc from/to theo giờ Việt Nam. DB lưu UTC (DSN loc=UTC).
  timezone: "Asia/Ho_Chi_Minh"

media:
  upload_dir: "uploads"
  # URL công khai của API (dùng để tạo file_url khi upload). Production: đặt PUBLIC_BASE_URL.
  public_base_url: ""

notifications:
  # Firebase service-account key for push (or env FCM_CREDENTIALS_FILE /
  # FCM_CREDENTIALS_BASE64). Empty: reminders are stored, not pushed.
  fcm_credentials_file: ""
  # Daily planting reminders go out from this hour (Asia/Ho_Chi_Minh).
  reminder_hour: 7
  check_interval: 10m

shop:
  name: "Hộ kinh doanh nông sản"
  phone: ""
  currency: "VND"
