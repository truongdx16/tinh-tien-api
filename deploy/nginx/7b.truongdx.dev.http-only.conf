# Bootstrap config used only to obtain the first Let's Encrypt certificate
# (before the certificate files exist, the HTTPS config cannot load).
# `./scripts/deploy.sh setup` swaps it for 7b.truongdx.dev.conf afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name 7b.truongdx.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
