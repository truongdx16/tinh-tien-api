# Tinh Tien API — Nginx
# Domain: 7b.truongdx.dev
#
# The Go API (systemd service tinh-tien-api) listens on 127.0.0.1:2170.
# Nginx terminates TLS, serves uploaded images directly and proxies the rest.
# Installed by `./scripts/deploy.sh setup` as
#   /etc/nginx/sites-available/7b.truongdx.dev.conf (+ symlink in sites-enabled)

# Login brute-force protection (zone names are global: keep them unique).
limit_req_zone $binary_remote_addr zone=tinhtien_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tinhtien_api:10m rate=20r/s;

upstream tinhtien_api {
    server 127.0.0.1:2170;
    keepalive 16;
}

# ─── HTTP → HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 7b.truongdx.dev;

    # Let's Encrypt challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 7b.truongdx.dev;

    ssl_certificate     /etc/letsencrypt/live/7b.truongdx.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/7b.truongdx.dev/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TinhTienTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product photos are uploaded through POST /api/v1/media/upload (API limit 32 MB).
    client_max_body_size 32m;

    # ── Uploaded images: served by nginx, cached by clients ──
    location /uploads/ {
        alias /var/www/tinh-tien-api/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ── Login: rate limited ──────────────────────────────────
    location ~ ^/(api/)?v1/auth/login$ {
        limit_req zone=tinhtien_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://tinhtien_api;
        include /etc/nginx/snippets/tinhtien-proxy.conf;
    }

    # ── Everything else → Go API ─────────────────────────────
    location / {
        limit_req zone=tinhtien_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://tinhtien_api;
        include /etc/nginx/snippets/tinhtien-proxy.conf;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/7b.truongdx.dev.access.log;
    error_log  /var/log/nginx/7b.truongdx.dev.error.log;
}
