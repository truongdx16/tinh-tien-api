services:
  mariadb:
    image: mariadb:11
    container_name: tinh-tien-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tinh_tien
      MARIADB_USER: tinh_tien
      MARIADB_PASSWORD: tinh_tien
    ports:
      - "2171:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
